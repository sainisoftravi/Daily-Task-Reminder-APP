<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Daily Task Log Reminder System</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #a5b4fc 0%, #818cf8 50%, #6366f1 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card-wrapper {
            width: 100%;
            max-width: 920px;
            background: #ffffff;
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.18);
            display: flex;
            min-height: 520px;
        }

        /* Left Column - Form */
        .login-left-col {
            flex: 1;
            padding: 40px 36px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .welcome-title {
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .welcome-subtitle {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 32px;
        }

        .error-alert {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            color: #b91c1c;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 24px;
            display: none;
        }

        .floating-field {
            position: relative;
            margin-bottom: 24px;
        }

        .floating-field label {
            position: absolute;
            top: -10px;
            left: 16px;
            background: #ffffff;
            padding: 0 6px;
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            z-index: 2;
        }

        .floating-field input {
            width: 100%;
            height: 52px;
            padding: 12px 18px;
            border-radius: 14px;
            border: 1.5px solid #64748b;
            font-size: 14px;
            color: #0f172a;
            outline: none;
            background: transparent;
            transition: all 0.2s;
        }

        .floating-field input::placeholder {
            color: #94a3b8;
        }

        .floating-field input:focus {
            border-color: #3b36e0;
            box-shadow: 0 0 0 3px rgba(59, 54, 224, 0.12);
        }

        .forgot-wrapper {
            text-align: right;
            margin-top: -12px;
            margin-bottom: 28px;
        }

        .forgot-wrapper a {
            color: #1e1b4b;
            font-weight: 600;
            font-size: 13px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-wrapper a:hover {
            color: #3b36e0;
            text-decoration: underline;
        }

        .btn-signin {
            width: 100%;
            height: 52px;
            background: #3b36e0;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(59, 54, 224, 0.35);
            transition: all 0.2s;
        }

        .btn-signin:hover {
            background: #2d28cb;
            transform: translateY(-1px);
            box-shadow: 0 12px 28px rgba(59, 54, 224, 0.45);
        }

        .btn-signin:active {
            transform: translateY(0);
        }

        /* Right Column - Hero Banner */
        .login-right-col {
            flex: 1;
            background: #8590ff;
            border-radius: 20px;
            padding: 32px 24px 24px 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .banner-img {
            width: 100%;
            max-width: 340px;
            max-height: 320px;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.15);
            margin-top: 8px;
        }

        .banner-footer {
            text-align: center;
            width: 100%;
            margin-top: 16px;
        }

        .banner-caption {
            color: #ffffff;
            font-style: italic;
            font-weight: 500;
            font-size: 15px;
            text-align: center;
            opacity: 0.95;
            line-height: 1.4;
            margin-bottom: 0;
        }

        /* Responsive Layout */
        @media (max-width: 768px) {
            .login-card-wrapper {
                flex-direction: column;
            }
            .login-right-col {
                min-height: 260px;
                padding: 24px;
            }
            .banner-img {
                max-height: 200px;
            }
        }
    </style>
</head>
<body>

    <div class="login-card-wrapper">
        <!-- Left Side: Login Form -->
        <div class="login-left-col">
            <h1 class="welcome-title">Welcome Back!</h1>
            <p class="welcome-subtitle">Please enter login details below</p>

            <div class="error-alert" id="error-box"></div>

            <form id="login-form" onsubmit="handleLoginSubmit(event)">
                <div class="floating-field">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" required placeholder="Enter the email">
                </div>

                <div class="floating-field">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="Enter the Password">
                </div>

                <div class="forgot-wrapper">
                    <a href="javascript:void(0)" onclick="alert('Please contact your administrator to reset your password.')">Forgot password?</a>
                </div>

                <button type="submit" class="btn-signin" id="submit-btn">Sign in</button>
            </form>
        </div>

        <!-- Right Side: Tasky Hero Graphic -->
        <div class="login-right-col">
            <img src="/static/images/login_illustration.jpg" alt="Task Management Illustration" class="banner-img">
            
            <div class="banner-footer">
                <p class="banner-caption">Manage your task in a easy and more efficient way with Tasky...</p>
            </div>
        </div>
    </div>

    <script>
        async function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const errorBox = document.getElementById('error-box');
            errorBox.style.display = 'none';

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = "Signing in...";
            submitBtn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (data.success && data.user) {
                    const role = data.user.role || 'employee';
                    if (role === 'employee') {
                        window.location.href = '/task-entry';
                    } else {
                        window.location.href = '/dashboard';
                    }
                } else {
                    errorBox.innerText = data.error || 'Invalid login credentials.';
                    errorBox.style.display = 'block';
                    submitBtn.innerText = 'Sign in';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                errorBox.innerText = 'Connection error. Please try again.';
                errorBox.style.display = 'block';
                submitBtn.innerText = 'Sign in';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
