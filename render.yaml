services:
  - type: web
    name: daily-task-reminder-app
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false
        comment: "Paste your Supabase PostgreSQL Connection String (e.g. postgresql://postgres.xxx:pass@aws-0-region.pooler.supabase.com:6543/postgres)"
      - key: SECRET_KEY
        generateValue: true
